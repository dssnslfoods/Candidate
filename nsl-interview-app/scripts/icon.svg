<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded square brand background — Berry gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a52450"/>
      <stop offset="100%" stop-color="#4a0e26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e7bd"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Stylised chef-hat / dome on a tray, evoking bakery -->
  <g transform="translate(96 110)">
    <!-- Top hat -->
    <path d="
      M 60 130
      C 30 130 0 100 14 70
      C 0 35 40 0 96 14
      C 132 -10 196 -10 232 14
      C 288 0 328 35 314 70
      C 328 100 298 130 268 130
      Z"
      fill="url(#gold)"
      stroke="#fbf6e9"
      stroke-width="6"
    />
    <!-- Hat band -->
    <rect x="50" y="130" width="228" height="34" rx="8" fill="#fbf6e9"/>
    <!-- Letter N (NSL) -->
    <text
      x="164"
      y="234"
      text-anchor="middle"
      font-family="Inter, system-ui, sans-serif"
      font-size="148"
      font-weight="800"
      fill="#fbf6e9"
      letter-spacing="-4"
    >N</text>
  </g>

  <!-- Bottom label "NSL" gold pill -->
  <g transform="translate(0 410)">
    <rect x="156" y="0" width="200" height="60" rx="30" fill="url(#gold)"/>
    <text
      x="256"
      y="42"
      text-anchor="middle"
      font-family="Inter, system-ui, sans-serif"
      font-size="32"
      font-weight="700"
      fill="#4a0e26"
      letter-spacing="3"
    >NSL FOODS</text>
  </g>
</svg>
